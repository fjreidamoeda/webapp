name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          echo "Android SDK at: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "No build-tools directory"
          SDKMANAGER=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -f "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found, installing cmdline-tools..."
            mkdir -p /tmp/android/cmdline-tools/latest
            cd /tmp/android
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o commandlinetools-linux-*.zip
            mv cmdline-tools/* cmdline-tools/latest/
            rm -rf "$ANDROID_HOME/cmdline-tools"
            mkdir -p "$ANDROID_HOME"
            cp -r cmdline-tools "$ANDROID_HOME/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          yes | "$SDKMANAGER" "build-tools;33.0.2" "platforms;android-34" 2>/dev/null || true
          echo "Final build-tools:"
          ls -la "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "Still missing"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.10/bin" >> $GITHUB_PATH
      - name: Install Cordova
        run: npm install -g cordova
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cordova platform add android@12 --no-telemetry
      - name: Build APK
        run: |
          cd platforms/android
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn