name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.10/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=$GITHUB_WORKSPACE/gradle-8.10" >> $GITHUB_ENV
      - name: Install Cordova
        run: npm install -g cordova
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cordova platform add android@12 --no-telemetry
      - name: Prepare Cordova
        run: npx cordova prepare android --no-telemetry
      - name: Build APK
        run: |
          cd platforms/android
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn